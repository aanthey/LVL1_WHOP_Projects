<!-- This declares the document type as HTML5 -->
<!DOCTYPE html>
<!-- this is the root element of the webpage --> 
<html>
  
 <!--Head tag includes meta data such as the title -->
<head>
        <meta charset="UTF-8">
        <meta name="description" content="Learn HTML easily">   
        <meta name="keywords" content="HTML, CSS, JavaScript">
        <meta name="author" content="Arvind">
        <title>My Webpage</title>
    </head>
    <!-- body tag holds all visible content -->
    <body>
        <!-- header tags -->
         <h1>Main Heading (h1)</h1>
         <h2>Sub Header (h2)</h2>
         <h3>Section Title (h3)</h3>
         <h4>Smaller Title (h4)</h4>
         <h5>Minor Heading (h5)</h5>
         <h6>Smallest Heading (h6)</h6>
         <!-- p tag for descriptions -->
         <p>this is a paragraph tag (p)</p>

         <div style="background-color: lightgrey; padding: 10px;">
            <h3>Div Section</h3>
            <p>This is a block level container using "div" tag.</p>
         </div>
        <p> This text container a <span style="color: red;">highlighted word</span> using < span > tag</span></p>
    </body>
</html>
